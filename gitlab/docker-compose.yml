services:
  gitlab:
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    restart: always

    hostname: gitlab

    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://20.65.117.37'
        gitlab_rails['gitlab_shell_ssh_port'] = 2222

    ports:
      - "80:80"
      - "443:443"
      - "2222:22"

    volumes:
      - ./config:/etc/gitlab
      - ./logs:/var/log/gitlab
      - ./data:/var/opt/gitlab